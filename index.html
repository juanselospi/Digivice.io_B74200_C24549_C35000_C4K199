<!DOCTYPE html>
<!-- pagina de inicio -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · Digivice.io</title>
  <meta name="description" content="Digivice.io es un juego multijugador en tiempo real. Escribe tu nickname, elige tu Digimon y entra a jugar.">
  <link rel="icon" href="assets/icon/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icon/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <header class="encabezado">
    <a class="encabezado__logo" href="index.html">
      <img src="assets/logo/rebranding.png" alt="Digivice.io, volver al inicio" width="160" height="32">
    </a>
    <nav class="menu" aria-label="Menú principal">
      <ul>
        <li><a href="index.html" aria-current="page">Inicio</a></li>
        <li><a href="reglas.html">Reglas</a></li>
        <li><a href="acerca.html">Acerca de nosotros</a></li>
      </ul>
    </nav>
    <!-- buscador por ahora es solo estetico -->
    <form class="buscador" role="search">
      <label class="solo-lectores" for="buscar">Buscar</label>
      <input type="search" id="buscar" name="q" placeholder="Buscar">
      <button class="buscador__boton" type="submit">Buscar</button>
    </form>
  </header>

  <main class="inicio">
    <h1 class="inicio__logo"><img src="assets/logo/rebranding.png" alt="Digivice.io" width="478" height="95"></h1>

    <!-- todo el inicio es un solo formulario.
         como todavia no hay javascript al enviarlo manda los datos a lobby.html por la URL y así el flujo ya funciona. -->
    <form class="inicio__formulario" action="lobby.html" method="get">
      <p class="inicio__nickname">
        <label for="nickname">Nickname</label>
        <input class="campo" type="text" id="nickname" name="nickname" placeholder="Nickname"
               required minlength="3" maxlength="16" autocomplete="nickname">
      </p>

      <fieldset class="selector">
        <legend class="selector__titulo">Elegir digimon</legend>
        <!-- cada digimon es un li.
             para agregar uno nuevo(si alguno lo quiere hacer despues):
              1. copien un li completo, con sus clases.
              2. cambien el id, el value, el nombre y el tipo (Data, Vaccine o Virus),
                 tambien al final de la clase del small (data, vaccine o virus)
              3. apunten el src al sprite _0 (el que esta quieto) de su carpeta en los assets/digishell
             las flechas < > del carrusel del diseño se hacen con JS despues, por ahora se ven todos los digimon al mismo tiempo. -->
        <ul class="selector__lista">
          <li>
            <input class="solo-lectores selector__radio" type="radio" id="digimon-agumon" name="digimon" value="agumon" checked>
            <label class="selector__opcion" for="digimon-agumon">
              <img class="selector__sprite" src="assets/digishell/3%20-%20Agumon%20EX/Agumon/c0189_0.png" alt="Sprite de Agumon" width="192" height="192">
              Agumon <small class="selector__tipo selector__tipo--vaccine">Vaccine</small>
            </label>
          </li>
          <li>
            <input class="solo-lectores selector__radio" type="radio" id="digimon-gabumon" name="digimon" value="gabumon">
            <label class="selector__opcion" for="digimon-gabumon">
              <img class="selector__sprite" src="assets/digishell/4%20-%20Gabumon%20EX/Gabumon/c0206_0.png" alt="Sprite de Gabumon" width="192" height="192">
              Gabumon <small class="selector__tipo selector__tipo--data">Data</small>
            </label>
          </li>
        </ul>
      </fieldset>

      <button class="boton inicio__jugar" type="submit">Jugar</button>
    </form>
  </main>

  <footer class="pie">
    <p class="pie__marca"><small>© 2026 Digivice.io</small></p>
    <p>Proyecto académico del curso CI-0137 Desarrollo de Aplicaciones Web, Universidad de Costa Rica.</p>
    <p>Digimon y sus personajes son propiedad de Bandai. Sitio sin fines de lucro.</p>
    <nav aria-label="Enlaces del pie de página">
      <ul>
        <li><a class="pie__enlace" href="creditos.html">Créditos</a></li>
        <li><a class="pie__enlace" href="https://github.com/juanselospi/Digivice.io_B74200_C24549_C35000_C4K199">Repositorio en GitHub</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
