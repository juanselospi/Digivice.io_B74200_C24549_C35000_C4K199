<!DOCTYPE html>
<!--
  plantilla base de digivice.io

  para hacer una pagina nueva:
    1. copien este archivo.
    2. ponganle el nombre que toca (lobby.html, reglas.html) y cambien todo lo que diga CAMBIAR.

  Reglas del grupo:
    1. nada de div ni span, solo etiquetas semanticas.
    2. los estilos van en css/: tokens.css, common.css y una hoja por pagina, con clases en formato BEM.
    3. antes de hacer merge pasen la pagina por el validador de la W3C
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CAMBIAR: el nombre de la pagina antes del punto -->
  <title>Nombre de la página · Digivice.io</title>
  <!-- CAMBIAR: una frase corta de que trata la pagina -->
  <meta name="description" content="Descripción corta de la página.">
  <!-- favicon, lo generamos a partir de assets/icon/digivice.png -->
  <link rel="icon" href="assets/icon/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icon/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <!-- fuentes: Chakra Petch para titulos e interfaz, Inter para texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <!-- estilos, en este orden -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <!-- CAMBIAR: la hoja de la pagina -->
  <link rel="stylesheet" href="css/nombre-pagina.css">
</head>
<body>
  <!-- header -->
  <!-- lobby y juego usan el encabezado de partida en vez de este:
  <header class="encabezado encabezado--partida">
    <a class="encabezado__logo" href="index.html">
      <img src="assets/logo/rebranding.png" alt="Digivice.io, volver al inicio" width="160" height="32">
    </a>
    <p class="encabezado__dato">Sala ABC123</p>
    <p class="encabezado__dato encabezado__dato--suave">5 de 6 jugadores</p>
    <a class="boton boton--borde" href="index.html">Salir de la partida</a>
  </header>
  -->
  <header class="encabezado">
    <a class="encabezado__logo" href="index.html">
      <img src="assets/logo/rebranding.png" alt="Digivice.io, volver al inicio" width="160" height="32">
    </a>
    <!-- en el menu solo van estas 3 paginas, como en el diseño.
         a lobby y juego se llega jugando, y creditos esta en el footer. -->
    <nav class="menu" aria-label="Menú principal">
      <ul>
        <!-- CAMBIAR: el aria-current="page" va en el enlace de la pagina en la que estamos. -->
        <li><a href="index.html" aria-current="page">Inicio</a></li>
        <li><a href="reglas.html">Reglas</a></li>
        <li><a href="acerca.html">Acerca de nosotros</a></li>
      </ul>
    </nav>
    <!-- buscador por ahora es solo estetico. -->
    <form class="buscador" role="search">
      <label class="solo-lectores" for="buscar">Buscar</label>
      <input type="search" id="buscar" name="q" placeholder="Buscar">
      <button class="buscador__boton" type="submit">Buscar</button>
    </form>
  </header>

  <main>
    <!-- CAMBIAR: aqui va el contenido de la pagina, siempre con un solo h1. -->
    <h1>Nombre de la página</h1>
  </main>

  <!-- footer tambien igual en todas las paginas.
       lobby y juego usan el pie corto: class="pie pie--corto" y solo el p de la marca y el nav. -->
  <footer class="pie">
    <p class="pie__marca"><small>© 2026 Digivice.io</small></p>
    <p>Proyecto académico del curso CI-0137 Desarrollo de Aplicaciones Web, Universidad de Costa Rica.</p>
    <p>Digimon y sus personajes son propiedad de Bandai. Sitio sin fines de lucro.</p>
    <nav aria-label="Enlaces del pie de página">
      <ul>
        <li><a class="pie__enlace" href="creditos.html">Créditos</a></li>
        <li><a class="pie__enlace" href="https://github.com/juanselospi/Digivice.io_B74200_C24549_C35000_C4K199">Repositorio en GitHub</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
